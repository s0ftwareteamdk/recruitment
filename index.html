function budSuggest(){
 // Kun kanaler med nok data. Billigste vs. dyreste pris pr. kvalificeret lead (bestået sprog- og situationstest)
 const ok=Object.keys(BUD.alloc).filter(k=>BUD.perf[k].q>=BUD.minQ);
 if(ok.length<2) return null;
 const s=ok.slice().sort((a,b)=>budCpq(a)-budCpq(b)), best=s[0], worst=s[s.length-1];
 const gap=1-budCpq(best)/budCpq(worst); if(gap*100<BUD.minGap) return null;

 return {from:worst,to:best,amt,gap:Math.round(gap*100),cb:Math.round(budCpq(best)),cw:Math.round(budCpq(worst))};
}

// Example piecework model (replace with dao/3F rates): pay per route-night, quality bonus per tier.
const PAY={perRouteNight:380,hoursPerRouteNight:1.75,maxHours:32,maxRoutes:3,weeks:4.33};
// 3F: Budoverenskomst for provinsen 2025–2028 (DEA for Danske Mediers Arbejdsgiverforening og 3F). Satser skifter automatisk på datoen.
const F3={name:'Budoverenskomst for provinsen 2025–2028 (3F)',
 min:[['2025-05-01',128.50],['2026-03-01',132.00],['2027-03-01',135.50]],
 night:[['2025-05-01',26.80],['2026-03-01',27.73],['2027-03-01',28.70]],
 saving:[['2024-03-01',9],['2026-03-01',10],['2027-03-01',11]],
 pensionEr:10.4,pensionEe:1.7,maxWeek:37,noticeDays:14,periodDays:14,pace:5.76,
 capitalPc:['1000-2999','3460','3500','3520']};
const rateOn=(tbl,date=new Date().toISOString().slice(0,10))=>tbl.filter(x=>x[0]<=date).slice(-1)[0][1];
const f3=()=>({min:rateOn(F3.min),night:rateOn(F3.night),saving:rateOn(F3.saving)});
const f3Floor=hours=>hours*(f3().min+f3().night); // guaranteed average incl. night supplement (work starting 23–06)
const capitalArea=a=>a==='KBH'; // postcodes under 3000 → Budoverenskomst for hovedstadsområdet (3F København)
function earnings(c){ const __e=earningsRaw(c); const hrs=__e.routeNights*PAY.hoursPerRouteNight, floor=f3Floor(hrs);
 __e.hours=hrs; __e.floor=Math.round(floor); __e.topup=Math.max(0,Math.round(floor-__e.earned)); __e.earned+=__e.topup; return __e; }
function earningsRaw(c){
 const day=new Date().getDate(), dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
 const nightsWk=c.avail.night?6:c.avail.day?4:2, routes=Math.max(1,c.routes.length);
 const nightsSoFar=Math.round(nightsWk/7*day), routeNights=nightsSoFar*routes;
 const tempo=0.9+Math.min(c.months,6)*0.02; // gets faster with experience
 const base=routeNights*PAY.perRouteNight*tempo, tr=tier(riderScore(c)), bonusSoFar=tr[2]*day/dim;
 const forecastBase=nightsWk*PAY.weeks*routes*PAY.perRouteNight*tempo;
 const nights=Array.from({length:Math.min(5,nightsSoFar)},(_,i)=>{const d=new Date();d.setDate(day-i*Math.round(7/nightsWk)-1);
  return {date:d.toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short'}),routes,parcels:routes*(118+((i*37+c.id.charCodeAt(4))%40)),kr:Math.round(routes*PAY.perRouteNight*tempo)}});
 return {earned:Math.round(base+bonusSoFar),forecast:Math.round(forecastBase+tr[2]),bonus:tr,routeNights,nightsWk,routes,tempo,nights,day,dim};
}
function plans(c,target){
 const e=earnings(c), out=[];
 for(let r=1;r<=PAY.maxRoutes;r++)for(const n of [4,5,6]){
  const hrs=r*n*PAY.hoursPerRouteNight; if(hrs>S.cfg.maxHours+0.01) continue;
  const base=r*n*PAY.weeks*PAY.perRouteNight*e.tempo;
  for(const [tn,te,b,cls,min] of [['–','–',0,'',0],['Bronze','Bronze',750,'',80],['Sølv','Silver',1500,'',86],['Guld','Gold',2500,'',92]]){
   out.push({r,n,hrs,total:Math.round(base+b),tier:L(tn,te),bonus:b,min});
  }}
 const ok=out.filter(p=>p.total>=target).sort((a,b)=>a.hrs-b.hrs||a.bonus-b.bonus);
 const best=ok[0]||out.sort((a,b)=>b.total-a.total)[0];
 return {best,reachable:!!ok[0],max:Math.max(...out.map(p=>p.total)),alts:ok.filter(p=>p!==best&&(p.r!==best.r||p.n!==best.n)).slice(0,2)};
}

 const fromDemand=S.demand.filter(d=>d.area===c.area&&!d.cancelled).flatMap(d=>{const used=d.assigned.flatMap(a=>a.routes);return (d.routeIds||[]).filter(r=>!used.includes(r))});
 const extra=[`${c.area}-N5${10+c.id.charCodeAt(4)%9}`,`${c.area}-N5${30+c.id.charCodeAt(3)%9}`];
 return [...new Set([...fromDemand,...extra])].slice(0,3).map((r,i)=>({id:r,stops:7+i*2,parcels:120+i*25,km:18+i*6,start:i?L('fra 1. dec.','from 1 Dec'):L('ledig nu','free now')}));
}

function sendPush(){
 const ids=Object.keys(S.pf.sel).filter(k=>S.pf.sel[k]); if(!ids.length){toast(L('Vælg mindst én kandidat','Select at least one candidate'));return}
 const camp={id:'P'+(100+S.camps.length),tpl:S.pf.tpl,at:new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}),ids};
 ids.forEach(id=>{const c=S.candidates.find(x=>x.id===id),[ti,bo,a1,a2]=tplTxt(S.pf.tpl,c);
  const title=S.pf.title??ti, body=(S.pf.body??bo).replace('{område}',area(c.area));
  c.msgs.unshift({id:camp.id+'-'+id,camp:camp.id,title,body,cta:[a1,a2],ch:deliver(c,title),status:'sent',at:camp.at});
  // simulate some replies from sample candidates
  if(id!==S.me){const r=(id.charCodeAt(4)+id.charCodeAt(3))%4; c.msgs[0].status=['accepted','read','declined','sent'][r]}
 });
 camp.title=S.pf.title??tplTxt(S.pf.tpl)[0]; S.camps.unshift(camp); S.pf.sel={};
 const nPush=ids.filter(id=>S.candidates.find(x=>x.id===id).msgs[0].ch==='push').length;
 toast(`✓ ${ids.length} ${L('sendt','sent')} · ${nPush} push · ${ids.length-nPush} SMS`);
}
function campStats(camp){
 const ms=camp.ids.map(id=>S.candidates.find(c=>c.id===id).msgs.find(m=>m.camp===camp.id));
 const n=k=>ms.filter(m=>m.status===k).length;
 return {sent:ms.length,push:ms.filter(m=>m.ch==='push').length,sms:ms.filter(m=>m.ch!=='push').length,read:n('read')+n('accepted')+n('declined'),acc:n('accepted'),dec:n('declined')};
}

function autoMatch(d){
 const pool=S.candidates.filter(c=>c.stage==='pool'&&c.area===d.area&&c.avail[d.shift]&&fresh(c))
  .sort((a,b)=>((b.scores?.scen||0)+(b.scores?.da||0))-((a.scores?.scen||0)+(a.scores?.da||0)));
 let need=d.routes-d.assigned.reduce((x,a)=>x+a.routes.length,0), n=d.assigned.length*3;
 if(!pool.length){toast(t('noMatch'));return}
 for(const c of pool){ if(need<=0)break;
  const k=Math.min(3,need); // 2–3 fixed routes per rider
  const routes=d.routeIds?takeRoutes(d,k):Array.from({length:k},(_,i)=>`${d.area}-${d.shift==='night'?'N':'D'}${String(301+n+i)}`);
  n+=routes.length; need-=routes.length;
  c.stage='active';c.routes=routes;c.months=0;
  d.assigned.push({name:c.name,routes,cid:c.id});
 }
 toast(need>0?`${t('assigned')}: ${d.assigned.length} · ${L('mangler','missing')} ${need}`:`✓ ${t('filled')}`);
}

 {t:['Recruit: godkend','Recruit: approve'],d:['dao Recruit er én app med roller. Rekrutterer verificerer attesten → rideren kommer i poolen og sendes automatisk til Emply.','dao Recruit is one app with roles. The recruiter verifies the record → the rider joins the pool and is sent to Emply automatically.'],
  run(){const c=ensureApplied();c.push=true;if(c.stage!=='pool'&&c.stage!=='active'){c.attest='verified';c.stage='pool';c.checkStatus='confirmed';c.lastCheck=new Date().toLocaleDateString('da-DK');emplyApproved(c);appInviteMsg(c)}rgo('rec','candidates');S.filter='all';S.selected=c.id}},
 {t:['Kontakt kandidater','Contact candidates'],d:['Invitation til introdag. Push hvor muligt – ellers SMS eller WhatsApp via Recruit.','Intro day invite. Push where possible – otherwise SMS or WhatsApp via Recruit.'],
  run(){const c=ensureApplied();rgo('rec','push');if(!S.camps.length){S.pf.sel={};pushList().forEach(x=>S.pf.sel[x.id]=true);sendPush()}}},
 {t:['Trin 3 · Godkendt → hent appen','Step 3 · Approved → get the app'],d:['Trin 1–2 var web: ingen download, så flere gennemfører. Nu er rideren godkendt og skal bruge systemet løbende – derfor tilbyder vi appen. Den er anbefalet, men ikke et krav.','Steps 1–2 were web: no download, so more people finish. Now the rider is approved and will use the system regularly – so we offer the app. Recommended, not required.'],
  run(){const c=ensureApplied();if(c.stage!=='pool'&&c.stage!=='active'){c.attest='verified';c.stage='pool';c.checkStatus='confirmed';appInviteMsg(c)}S.view='rider';S.appMode=false;S.submitted=c}},
 {t:['Rider-appen','The Rider app'],d:['I appen kører push, opstart med makker og terminal, faste ruter, ledighedstjek – og henvisning af venner.','In the app: push, start-up with buddy and terminal, fixed routes, availability checks – and referring friends.'],
  run(){const c=ensureApplied();c.app=true;c.webOnly=false;c.push=true;S.appMode=true;S.webMode=false;S.view='rider';S.riderTab='start'}},
 {t:['Vil ikke downloade? Web + SMS','Won’t download? Web + SMS'],d:['Samme funktioner på web. Push erstattes af SMS med svar-link – ruter, ledighedstjek og ekstravagter når stadig frem. Rideren kan skifte til appen når som helst.','Same features on web. Push is replaced by SMS with a reply link – routes, availability checks and extra shifts still get through. The rider can switch to the app at any time.'],
  run(){const c=ensureApplied();c.app=false;c.webOnly=true;S.appMode=true;S.webMode=true;S.view='rider';S.riderTab='msgs'}},
 {t:['Driftsleder: pool pr. område','Ops manager: pool by area'],d:['Samme app, rollen Driftsleder: kortet viser dækning pr. region – grøn, gul, rød.','Same app, role Operations manager: the map shows coverage per region – green, amber, red.'],
  run(){rgo('ops','overview')}},
 {t:['Tildel rideren','Assign the rider'],d:['Områdevisningen viser anonymiserede riders. “Tildel” åbner valget af behov.','The area view shows anonymised riders. “Assign” opens the choice of need.'],
  run(){const c=ensureApplied();rgo('ops','overview');if(c.stage!=='pool'){c.stage='pool';c.checkStatus='confirmed'}MGMT.demo.openFor(c.id)}},
 {t:['Tildelt – navn vises','Assigned – name revealed'],d:['Rideren får 2–3 faste ruter og et rutetilbud. Først nu ser dao navn og telefon.','The rider gets 2–3 fixed routes and a route offer. Only now does dao see name and phone.'],
  run(){const c=ensureApplied();rgo('ops','overview');if(c.stage==='pool'){MGMT.demo.openFor(c.id);MGMT.demo.assign(c.id)}else MGMT.demo.openFor(c.id)}},
 {t:['Behov & tildeling','Needs & assignment'],d:['Alle behov samlet: fra dao, fra opsigelser (genbesættelse) og auto-match fra poolen.','All needs in one place: from dao, from resignations (replacement) and auto-match from the pool.'],
  run(){rgo('ops','demand')}},
 {t:['Kampagner: budget','Campaigns: budget'],d:['Budget anbefales ud fra mangel pr. region + en landsdækkende kampagne, der altid kører. Ret pris pr. ansøgning og se tallene ændre sig.','Budget is recommended from the gap per region + a nationwide campaign that always runs. Change cost per application and watch the numbers.'],
  run(){rgo('rec','campaigns')}},
 {t:['Kampagne: tekst & video','Campaign: copy & video'],d:['Regional kampagne oprettes med tekst og videoscript i dao’s tone – byerne flettes ind. Sendes til dao til godkendelse.','A regional campaign is created with copy and video script in dao’s tone – towns merged in. Sent to dao for approval.'],
  run(){rgo('rec','campaigns');if(CAMP._seed){CAMP._seed();CAMP._seed=null}const r=budgetPlan().rows.filter(x=>x.gap>0&&!CAMP.list.some(c=>c.region===x.id));if(r[0])campCreate(r[0].id);else CAMP.open=CAMP.list[0].id;CAMP.tab='video'}},
 {t:['dao godkender → live','dao approves → live'],d:['dao ejer Meta-kontoen og godkender. Tallene følger hele vejen til ansat i Emply og pris pr. ansat.','dao owns the Meta account and approves. Numbers follow all the way to hired in Emply and cost per hire.'],
  run(){rgo('rec','campaigns');const c=CAMP.list.find(x=>x.status==='pending');if(c){c.status='live';c.approvedBy='dao Marketing';campSim(c);CAMP.open=c.id;CAMP.tab='text'}}},
 {t:['Budgetregel: forslag → godkend','Budget rule: suggest → approve'],d:['Hver kanal har et gulv, så den aldrig lukker ned. Systemet foreslår at flytte budget, når en kanal leverer kvalificerede kandidater mindst 25 % billigere – rekrutteren godkender med ét klik, og alt logges.','Each channel has a floor so it never shuts down. The system suggests moving budget when a channel delivers qualified candidates at least 25% cheaper – the recruiter approves with one click and everything is logged.'],
  run(){rgo('rec','campaigns');BUD.dismiss=false;setTimeout(()=>{const e=document.getElementById('budrule');if(e)e.scrollIntoView({block:'start'})},60)}},
 {t:['Kanaler & frafald','Channels & drop-off'],d:['Web/app-modellen forklaret for dao – og Meta, TikTok, Google og henvisninger side om side: leads, screening, pool, ansat og pris pr. ansat – plus frafald pr. trin og påmindelser.','Meta, TikTok, Google and referrals side by side: leads, screening, pool, hired and cost per hire – plus drop-off per step and reminders.'],
  run(){rgo('rec','channels')}},
 {t:['Økonomi-lommeregner','Cost calculator'],d:['dao indtaster egne tal. Tre scenarier ud fra benchmarks fra nettet (Jobindex, Indeed, Meta, TikTok, Google, SMS/WhatsApp) – med kilder. Viser behov, pris pr. ansættelse og besparelse.','dao enters its own numbers. Three scenarios from web benchmarks (Jobindex, Indeed, Meta, TikTok, Google, SMS/WhatsApp) – with sources. Shows need, cost per hire and saving.'],
  run(){rgo('adm','economy')}},
 {t:['Emply-integration','Emply integration'],d:['Kun admin-rollen ser integrationen: flow, hvad der sendes, status-kobling og sync-log.','Only the admin role sees the integration: flow, what is sent, status mapping and sync log.'],
  run(){rgo('adm','emply')}},
 {t:['Opsigelse → genbesættelse','Resignation → replacement'],d:['Recruit tjekker Emply hvert 15. minut – en opsigelse bliver til et behov med de samme ruter. ① Ansatte drivere med kapacitet inden for 10 km af terminalen spørges om midlertidig overtagelse. ② Poolen inden for 10 km af terminalen får rutetilbud. Afregning efter 3F. Ret afstanden med skyderen.','Recruit checks Emply every 15 minutes – a resignation becomes a need with the same routes. ① Employed drivers with capacity within 10 km are asked to take over temporarily. ② The pool within 10 km gets a route offer. Change the distance with the slider.'],
  run(){rgo('ops','demand');if(S.demand.filter(d=>d.src==='resign'&&!d.assigned.length).length<1){const a=S.candidates.find(x=>x.stage==='active'&&x.area==='KBH');if(a)emplyResign(a,true)}}},
 {t:['Ledighedstjek','Availability check'],d:['Hver 2. uge spørger vi poolen “Er du stadig ledig?”. Intet svar i 7 dage = uaktuel.','Every 2nd week we ask the pool “Still available?”. No reply in 7 days = stale.'],
  run(){rgo('rec','pool')}},
 {t:['Driver: indtjening & mål','Driver: earnings & target'],d:['Vejledende indtjening, mål-løn med anbefalede ruter – inden for 32 t/uge. Nederst: rettigheder efter 3F (mindsteløn, nattillæg, garanti, opsparing, pension).','Indicative earnings, target pay with recommended routes – within 32 h/week. At the bottom: rights under 3F (minimum, night supplement, guarantee, savings, pension).'],
  run(){const d=S.candidates.find(x=>x.stage==='active'&&x.months>=3)||S.candidates.find(x=>x.stage==='active');S.me=d.id;S.submitted=d;S.user={name:d.name,method:'mitid'};S.riderTab='earn';S.view='rider';d.target=33000;secLog(d.name,L('Så egen indtjening','Viewed own earnings'),'ok')}},
 {t:['Henvis en ven','Refer a friend'],d:['Hver driver har en personlig kode. Vennen bruger den i 30-sekunders-formularen, og bonus udløses efter 4 ugers ansættelse.','Every driver has a personal code. The friend uses it in the 30-second form, and the bonus is triggered after 4 weeks of employment.'],
  run(){const d=S.candidates.find(x=>x.id==='C2412'&&x.stage==='active')||S.candidates.find(x=>x.stage==='active');S.me=d.id;S.submitted=d;S.user={name:d.name,method:'mitid'};S.riderTab='ref';S.view='rider';S.appMode=true;S.webMode=false}},
 {t:['Sikkerhed (NIS2)','Security (NIS2)'],d:['Kontroller efter dao’s Code of Conduct og NIS2, plus adgangslog over hele demoen – inkl. cookie-valg og logins.','Controls per dao’s Code of Conduct and NIS2, plus the access log for the whole demo – incl. cookie choices and logins.'],
  run(){rgo('adm','sec')}},
]};
function rgo(role,page){S.view='recruit';S.rUser={name:{rec:'Ditte-Marie O.',ops:'Henrik L.',adm:'Admin (dao IT)'}[role],role};MGMT.demo.login();S.rpage=page;S.selected=null;MGMT.demo.close()}
function tourGo(i){
 if(i<0||i>=TOUR.steps.length) return;
 // replay earlier steps that change data, so jumping ahead is consistent
 TOUR.i=i; S.mitid=null;S.pushPrompt=false;S.profileOpen=false;S.webMode=false; TOUR.steps[i].run(); render(); window.scrollTo(0,0);
}
function tourBar(){
 const k=S.lang==='da'?0:1, n=TOUR.steps.length, st=TOUR.steps[TOUR.i];
 if(TOUR.min) return `<button data-act="tourMin" class="fixed bottom-4 right-4 z-[60] bg-neutral-900 text-white font-extrabold text-sm rounded-full px-4 py-3 shadow-2xl">▶ ${L('Demo-guide','Demo guide')}</button>`;
 return `<div class="fixed bottom-0 inset-x-0 z-[60] p-3"><div class="max-w-xl mx-auto bg-neutral-900 text-white rounded-2xl shadow-2xl p-4">
  <div class="flex items-center gap-2"><p class="text-xs font-black text-red-300">${L('GUIDET DEMO','GUIDED DEMO')} ${TOUR.i>=0?`· ${TOUR.i+1}/${n}`:''}</p>
   <div class="flex-1 h-1 bg-white/15 rounded-full overflow-hidden"><div class="h-full bg-red-400" style="width:${(TOUR.i+1)/n*100}%"></div></div>
   <button data-act="tourMin" class="text-white/60 text-lg leading-none px-1">–</button></div>
  <p class="font-black mt-1">${st?st.t[k]:L('Se hele flowet uden at indtaste noget','See the whole flow without typing anything')}</p>
  <p class="text-sm text-white/75">${st?st.d[k]:L('Tryk “Start”. Hvert trin udfylder og klikker for dig. Du kan altid klikke selv i appen eller bruge ⚡ Autofyld.','Press “Start”. Each step fills in and clicks for you. You can always click around yourself or use ⚡ Autofill.')}</p>
  <div class="flex gap-2 mt-3">
   ${TOUR.i>0?`<button data-act="tourPrev" class="px-4 py-2 rounded-full text-sm font-bold bg-white/10">‹ ${L('Tilbage','Back')}</button>`:''}
   <button data-act="tourReset" class="px-4 py-2 rounded-full text-sm font-bold bg-white/10">↺ ${L('Forfra','Restart')}</button>
   ${TOUR.i<n-1?`<button data-act="tourNext" class="ml-auto px-5 py-2 rounded-full text-sm font-extrabold bg-dao">${TOUR.i<0?L('Start','Start'):L('Næste','Next')} ›</button>`:`<span class="ml-auto text-sm font-bold text-emerald-300 py-2">✓ ${L('Slut på demoen','End of demo')}</span>`}
  </div></div></div>`;
}

render();
</script>
</body>
</html>
