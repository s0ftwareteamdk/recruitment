<script>
// ================= dao Hire Entry · demo (testdata, ingen backend) =================
// Ansøgning → Pre-interview (AI) → Interview (HR) → Prøveperiode (AI-assisted) → Fuld ansættelse
const AREAS={KBH:'Hovedstaden · Taastrup',SJL:'Sjælland · Roskilde',OST:'Østjylland · Aarhus',SYD:'Sydjylland · Fredericia',NOR:'Nordjylland · Aalborg'};
const VEH={truck:'Lastbil',van:'Varevogn',car:'Bil',scooter:'Scooter',ebike:'Cykel/elcykel'};
const LIC={none:'Intet kørekort',AM:'Knallert (AM)',B:'Bil (B)',C:'Lastbil (C1/C)'};
const LIC_HELP={B:'Giver også ret til varevogn op til 3.500 kg og knallert',C:'Inkluderer B'};
const LIC_YEARS={lt1:'Under 1 år','1-3':'1–3 år',gt3:'Over 3 år'};
/** Hvilke kørekort køretøjet kræver (B og C giver også ret til knallert). */
const NEEDS_LIC={truck:['C'],van:['B','C'],car:['B','C'],scooter:['AM','B','C'],ebike:['none','AM','B','C']};
const VEH_WHO={truck:'lastbilchauffører',van:'varevognschauffører',car:'chauffører i bil',scooter:'scooterbude',ebike:'cykelbude'};
const VEH_ICON={truck:'🚛',van:'🚐',car:'🚗',scooter:'🛵',ebike:'🚲'};
/** Aktuelle behov pr. område og køretøj – sættes af HR/drift. */
const NEEDS={KBH:{truck:0,van:5,car:2,scooter:0,ebike:0},SJL:{truck:0,van:1,car:2,scooter:0,ebike:0},OST:{truck:0,van:2,car:1,scooter:1,ebike:0},SYD:{truck:0,van:0,car:2,scooter:0,ebike:0},NOR:{truck:1,van:1,car:0,scooter:0,ebike:0}};
const VEH_JOB={truck:'lastbilchauffør',van:'varevognschauffør',car:'chauffør i bil',scooter:'scooterbud',ebike:'cykelbud'};
/** Prioritering: AI-anbefalede inviteres efter score op til ledige job × 2. */
function rankOf(c){const pool=S.cands.filter(x=>x.stage==='ai'&&x.area===c.area&&x.veh===c.veh&&x.ai&&x.ai.rec[0]==='Anbefal interview').sort((a,b)=>b.ai.score-a.ai.score);const busy=S.cands.filter(x=>x.stage==='hr'&&x.area===c.area&&x.veh===c.veh).length;const cap=Math.max(0,(NEEDS[c.area]?.[c.veh]??0)*2-busy);const k=pool.indexOf(c)+1;return {k,n:pool.length,cap,invited:k>0&&k<=cap}}
/** Regel (ingen AI): passer ansøgeren til et aktuelt behov? */

// ---------- AI (eksempel – i drift Azure OpenAI i dao's Azure, pseudonymiseret input) ----------
function aiAssess(ans){
 const w={mot:[85,55,80],night:[95,70,35],exp:[90,75,50],start:[90,75,55],snow:[95,35,10],closed:[95,15,30],scan:[95,30,40],pay:[90,45,60]};
 const sc=Object.entries(ans).map(([k,v])=>w[k][v]);
 const score=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
 const flags=[];
 if(ans.night===2)flags.push('Kun 1–2 nætter om ugen – dao har brug for 5–6');
 if(ans.snow===2||ans.closed===1)flags.push('Svar i situationsspørgsmål bryder procedure');
 if(ans.scan===1)flags.push('Undervurderer scanning');
 if(ans.pay===1)flags.push('Foretrækker fast timeløn (akkord er standard)');
 const riskPts=(ans.mot===1?2:0)+(ans.night>=1?ans.night:0)+(ans.start===2?1:0)+(ans.pay===1?2:ans.pay===2?1:0);
 const risk=riskPts<=1?['Lav','bg-emerald-50 text-emerald-700']:riskPts<=3?['Mellem','bg-amber-50 text-amber-800']:['Høj','bg-orange-100 text-orange-800'];
 const rec=score>=80&&flags.length===0?['Anbefal interview','bg-emerald-50 text-emerald-800']:score>=65?['Vurdér manuelt','bg-amber-50 text-amber-800']:['Ikke anbefalet','bg-orange-50 text-orange-800'];
 const parts=[];
 parts.push(ans.mot===1?'Motivationen er primært at få et job.':'Kandidaten virker motiveret for selvstændigt natarbejde.');
 parts.push(['Kan køre 5–6 nætter om ugen.','Kan køre 3–4 nætter om ugen.','Kan kun køre 1–2 nætter om ugen.'][ans.night]);
 parts.push(ans.snow===0&&ans.closed===0&&ans.scan===0?'Svarer sikkert og efter procedure i alle situationer.':'Enkelte svar afviger fra dao’s procedurer.');
 if(flags.length)parts.push('Spørg ved interview ind til: '+flags.map(f=>f.toLowerCase()).join('; ')+'.');
 return {score,risk,rec,flags,summary:parts.join(' ')};
}

function setKpi(c,rows,src){
 if(!rows.length){toast('Ingen rækker fundet');return}
 const avg=k=>rows.reduce((x,r)=>x+r[k],0)/rows.length;
 c.kpi={ontime:Math.round(avg('ontime')),scan:Math.round(avg('scan')),proc:Math.round(avg('proc')),absence:rows.reduce((x,r)=>x+r.absence,0),incidents:rows.reduce((x,r)=>x+r.incidents,0)};
 c.kpiSrc=src;c.kpiAt=now();log(c,`KPI opdateret (${src}, ${rows.length} rækker)`);toast(`✓ ${rows.length} ${rows.length===1?'registrering':'dage'} indlæst`);
}
const parseCsv=t=>t.split(/\r?\n/).slice(1).map(l=>l.split(/[;\t]/)).filter(x=>x.length>=6).map(x=>({ontime:+x[1].replace(',','.'),scan:+x[2].replace(',','.'),proc:+x[3].replace(',','.'),absence:+x[4],incidents:+x[5]})).filter(r=>!isNaN(r.ontime));
function aiTurn(){
 S.typing=true;render();

}
function answer(i,text){
 const q=QUESTIONS[S.qi]; S.me.ans=S.me.ans||{}; S.me.ans[q.id]=i; S.chat.push({me:true,t:text??q.opts[i]}); S.qi++;
 if(S.qi>=QUESTIONS.length){S.me.ai=aiAssess(S.me.ans);S.me.stage='ai';S.typing=true;render();setTimeout(()=>{S.typing=false;S.chat.push({t:'Tak for dine svar! Jeg har sendt en opsummering til dao’s HR. Du hører fra dem inden for 2 hverdage.'});log(S.me,'AI-interview gennemført · score '+S.me.ai.score,['POST /applications/{id}/form-data',`AI-interview: score ${S.me.ai.score} · frafaldsrisiko ${S.me.ai.risk[0].toLowerCase()} · ${S.me.ai.rec[0].toLowerCase()}`]);render()},900);return}
 aiTurn();
}

  case 'kpiTab':S.kpiTab=el.dataset.t;break;

  case 'csvDemo':setKpi(c,parseCsv('dato;punktlighed;scanning;procedure;fravaer;haendelser\n2026-11-10;93;96;97;0;0\n2026-11-11;88;94;92;0;1\n2026-11-12;95;97;96;0;0\n2026-11-13;90;95;94;1;0'),'csv');break;
  case 'kpiManual':{const r={};for(const [k] of KPIS){const v=+String(document.querySelector(`[data-kpi="${k}"]`).value).replace(',','.');if(isNaN(v)){toast('Udfyld alle felter');return}r[k]=v}setKpi(c,[r],'manual');break}
  case 'confirm':c.stage='full';c.confirmed={by:'Mette K. (HR)',at:new Date().toLocaleDateString('da-DK')};log(c,'Fuld ansættelse bekræftet',['POST /applications/{id}/form-data · Ansat','Fuld ansættelse bekræftet (HR)']);toast('🎉 Fuld ansættelse bekræftet');break;
  case 'tourNext':tourGo(TOUR.i+1);return;
  case 'tourPrev':tourGo(TOUR.i-1);return;
  case 'tourMin':TOUR.min=!TOUR.min;break;
  case 'tourReset':location.reload();return;
 }
 render();
});

// ================= GUIDET DEMO =================
function ensureMe(stage){
 if(!S.me||S.me.stage==='wait'){S.form={...S.form,name:'Mikkel Jensen',veh:'van',lic:'B',attest:true};newApplicant()}
 const c=S.me;
 if(stage>=1&&!c.ai){c.ans={mot:0,night:0,exp:1,start:0,snow:0,closed:0,scan:0,pay:0};c.ai=aiAssess(c.ans);c.stage='ai'}
 if(stage>=2&&!c.meet){c.meet={type:'teams',slot:SLOTS[0]};c.stage='hr'}
 if(stage>=2.5&&!c.interview){c.interview={ok:true,by:'Mette K. (HR)',at:new Date().toLocaleDateString('da-DK')};c.stage='start';c.ob={contract:true,docs:false,gear:false,buddy:true,sms:false}}
 if(stage>=3&&c.stage==='start'){c.ob={contract:true,docs:true,gear:true,buddy:true,sms:true};c.stage='trial';c.week=5;c.kpi={ontime:89,scan:96,proc:93,absence:0,incidents:1}}
 return c;
}
const TOUR={i:-1,min:false,steps:[

 {t:'Aktuelle behov',d:'HR eller drift angiver, hvad dao søger lige nu pr. område og køretøj. Ansøgere matches automatisk på område, køretøj og kørekort – en regel, ikke AI. Prøv at sætte cykel i Hovedstaden fra 0 til 2: ventelisten får straks en SMS.',run(){S.view='hr';S.page='needs';S.sel=null}},
 {t:'Kør alle ansøgninger mod behovene',d:'Ét klik: alle ansøgninger i Emply – også de gamle – læses af AI og matches med behovene. Alle får svar: passer de, får de SMS om et ledigt job og AI-interviewet. Ellers kommer de på listen. Efter AI-interviewet inviteres de bedst egnede først – op til 2 samtaler pr. ledigt job. Resten får “du er på listen” og rykker op, når der bliver plads. Her: 1 lastbiljob i Nordjylland, 3 ansøgere.',run(){S.view='hr';S.page='needs';S.sel=null;if(!S.batch)runAll()}},
 {t:'Ikke det vi søger lige nu → venteliste',d:'En cykelbud-ansøger i Hovedstaden får en venlig SMS: hvad dao søger lige nu, og at hun får besked, når der er brug for cykelbude. Ingen afvisning – ansøgningen gemmes i op til 6 måneder med samtykke.',run(){S.view='cand';S.form={...S.form,name:'Freja Holm',veh:'ebike',lic:'none',attest:true,keep:true,area:'KBH'};const c=newApplicant();c.stage='wait';c.waitWhy=matchNeed(c).why;S.me=null;S.step='waitSms';S.me=c}},
 {t:'SMS med link til AI-interview',d:'Få sekunder efter får kandidaten en SMS. Interviewet tager ca. 10 minutter og kan tages, når det passer – også om natten.',run(){S.view='cand';ensureMe(0);S.step='sms'}},
 {t:'② Pre-interview · AI',d:'AI’en siger først, at den er en AI. Den stiller 8 spørgsmål: motivation, nætter, erfaring, opstart og situationer (sne, lukket butik, scanning). Svar med knapperne – eller skriv selv.',run(){S.view='cand';ensureMe(0);S.step='interview';if(!S.chat.length){S.qi=0;aiTurn()}}},
 {t:'Booking ved SMS-svar',d:'Anbefaler AI interview, får kandidaten automatisk en SMS med 3 ledige tider fra HR’s Outlook. Hun svarer 1, 2 eller 3 – og tiden er booket med Teams-link. 0 giver nye tider, TLF giver telefonmøde. Ikke klart anbefalet → HR beslutter. Prøv at svare.',run(){const c=ensureMe(1);c.ai={...c.ai,rec:['Anbefal interview','bg-emerald-50 text-emerald-800']};c.stage='ai';S.view='cand';S.smsThread=[];S.smsPage=0;S.step='smsBook'}},
 {t:'HR: hele flowet på én skærm',d:'Fem trin med tydeligt ansvar – AI eller HR. AI-score og frafaldsrisiko står direkte i listen. Det sparer den manuelle screening.',run(){ensureMe(2);S.view='hr';S.page='flow';S.filter='all';S.sel=null}},
 {t:'AI-opsummering → Emply',d:'HR ser score, frafaldsrisiko, en kort opsummering, flag og hele interviewet. Resultatet er sendt til Emply. HR inviterer eller afviser – AI afviser aldrig selv.',run(){S.view='hr';S.page='flow';S.filter='1';const c=S.cands.find(x=>x.stage==='ai'&&x.ai.flags.length)||S.cands.find(x=>x.stage==='ai');S.sel=c.id}},
 {t:'③ Interview · HR',d:'Bookingerne ligger i HR’s kalender. Efter samtalen godkender HR med én knap – det synkes til Emply som “Samtale”, og prøveperioden starter.',run(){const c=ensureMe(2);S.view='hr';S.page='calendar';S.sel=c.id}},
 {t:'④ Opstart før første nat',d:'Prøveperioden starter med en tjekliste: kontrakt fra Emply, udstyr, makker (matches automatisk på område og køretøj) og en SMS dagen før med mødested og tid. Rideren kører først alene, når alt er klar.',run(){const c=ensureMe(2.5);S.view='hr';S.page='flow';S.filter='3';S.sel=c.id}},
 {t:'④ Prøveperiode · AI-assisted',d:'AI følger arbejdsgange og disciplin: punktlighed, scanning, procedure i pakkeshop, fravær og hændelser – og markerer afvigelser før check-ins i uge 1, 4, 8 og 12. Data kommer via integration, CSV-upload eller manuel indtastning.',run(){const c=ensureMe(3);S.view='hr';S.page='flow';S.filter='3';S.sel=c.id;S.kpiTab='csv'}},
 {t:'⑤ Fuld ansættelse · HR',d:'HR bekræfter fuld ansættelse. Status sendes til Emply og logges.',run(){const c=ensureMe(3);S.view='hr';S.page='flow';S.filter='3';S.sel=c.id;S.kpiTab='api'}},
 {t:'AI svarer ansøgernes spørgsmål',d:'Løn, arbejdstid, eget køretøj, opstart – AI svarer døgnet rundt på SMS eller WhatsApp, men kun ud fra dao’s egne godkendte svar. Prøv knapperne – det sidste spørgsmål ved den ikke svaret på, så det går til HR.',run(){ensureMe(0);S.view='cand';S.step='ask'}},
 {t:'HR: kun det AI ikke ved',d:'Her lander kun de spørgsmål, AI’en ikke kunne svare på. HR svarer på SMS – og kan gemme svaret, så AI’en kan svare næste gang. Tallene viser, hvor meget HR aflastes.',run(){S.view='hr';S.page='inbox';S.sel=null}},
 {t:'Kandidaten følger med',d:'Kandidaten ser hele tiden, hvor hun er, og hvad næste skridt er – på mobil-web med SMS. Ingen app.',run(){ensureMe(3);S.view='cand';S.step='status'}},
 {t:'Tid sparet for dao',d:'Hvert trin er mærket Auto, AI eller HR – med minutter før og nu. Ret tallene til dao’s egne og se timer sparet pr. år og pr. ansat. Tallene er eksempler, som måles i piloten.',run(){S.view='hr';S.page='time';S.sel=null}},
 {t:'AI læser Emply-ansøgninger',d:'Emply-ansøgninger har ingen faste felter for køretøj og kørekort. AI læser ansøgningsteksten, finder køretøj, kørekort og område – med citat som bevis – og matcher med de aktuelle behov. Mangler noget, spørges der i AI-interviewet. Tryk “Hent nye ansøgninger nu”.',run(){S.view='hr';S.page='emply';S.sel=null}},
 {t:'Emply',d:'Ansøgninger hentes hvert 15. minut. AI-resultat, interview, prøveperiode og ansættelse skrives tilbage på ansøgningen.',run(){S.view='hr';S.page='emply';S.sel=null}},
 {t:'AI & sikkerhed',d:'Rekruttering med AI er højrisiko efter AI-forordningen. Gennemsigtighed, menneskelig beslutning, pseudonymisering, logning – og det hele kører i dao’s eget Azure.',run(){S.view='hr';S.page='ai';S.sel=null}},
]};
function tourGo(i){if(i<0||i>=TOUR.steps.length)return;TOUR.i=i;TOUR.min=false;TOUR.steps[i].run();render();window.scrollTo(0,0)}
function tourBar(){
 const n=TOUR.steps.length, st=TOUR.steps[TOUR.i];
 if(TOUR.min) return `<button data-act="tourMin" class="fixed bottom-4 right-4 z-[60] bg-neutral-900 text-white font-extrabold text-sm rounded-full px-4 py-3 shadow-2xl">▶ Demo-guide</button>`;
 return `<div class="fixed bottom-0 inset-x-0 z-[60] p-3"><div class="max-w-xl mx-auto bg-neutral-900 text-white rounded-2xl shadow-2xl p-4">
  <div class="flex items-center gap-2"><p class="text-xs font-black text-red-300">GUIDET DEMO · ${TOUR.i+1}/${n}</p><div class="flex-1 h-1 rounded-full bg-white/15"><div class="h-1 rounded-full bg-dao" style="width:${(TOUR.i+1)/n*100}%"></div></div><button data-act="tourMin" class="text-white/60 text-lg leading-none">–</button></div>
  ${st?`<p class="font-black text-lg mt-2">${st.t}</p><p class="text-sm text-white/80 mt-1">${st.d}</p>`:`<p class="font-black text-lg mt-2">dao Hire Entry</p><p class="text-sm text-white/80 mt-1">Ansøgning → Pre-interview (AI) → Interview (HR) → Prøveperiode (AI-assisted) → Fuld ansættelse. Tryk “Start”, eller klik selv rundt.</p>`}
  <div class="flex gap-2 mt-3">${TOUR.i>0?`<button data-act="tourPrev" class="px-4 py-2 rounded-full bg-white/10 font-bold text-sm">‹ Tilbage</button>`:''}${TOUR.i>0?`<button data-act="tourReset" class="px-4 py-2 rounded-full bg-white/10 font-bold text-sm">↺ Forfra</button>`:''}
   ${TOUR.i<n-1?`<button data-act="tourNext" class="ml-auto px-5 py-2 rounded-full bg-dao font-extrabold text-sm">${TOUR.i<0?'Start':'Næste'} ›</button>`:`<button data-act="tourMin" class="ml-auto px-5 py-2 rounded-full bg-dao font-extrabold text-sm">Klik selv rundt</button>`}</div>
 </div></div>`;
}
