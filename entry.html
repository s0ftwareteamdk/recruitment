<script>
// ================= dao Hire Entry · demo (testdata, ingen backend) =================
// Ansøgning → Pre-interview (AI) → Interview (HR) → Prøveperiode (AI-assisted) → Fuld ansættelse
const AREAS={KBH:'Hovedstaden · Taastrup',SJL:'Sjælland · Roskilde',OST:'Østjylland · Aarhus',SYD:'Sydjylland · Fredericia',NOR:'Nordjylland · Aalborg'};
const VEH={car:'Bil',scooter:'Scooter',ebike:'Elcykel'};
const FLOW=[
 {n:'Ansøgning',who:'',d:'Emply eller straksansøgning'},
 {n:'Pre-interview',who:'AI',d:'AI-interview · score · frafaldsrisiko'},
 {n:'Interview',who:'HR',d:'Teams · telefon · personligt'},
 {n:'Prøveperiode',who:'AI-assisted',d:'Arbejdsgange og disciplin'},
 {n:'Fuld ansættelse',who:'HR',d:'HR bekræfter'},
];
const QUESTIONS=[
 {id:'mot',q:'Hej! Jeg er dao’s AI-assistent og stiller dig 8 korte spørgsmål. Det tager ca. 10 minutter. Først: hvorfor vil du gerne køre for dao?',opts:['Jeg kan godt lide at arbejde selvstændigt om natten','Jeg mangler et job lige nu','Jeg har kørt for andre fragtfirmaer']},
 {id:'night',q:'Arbejdet foregår om natten, typisk kl. 23–06. Hvor mange nætter om ugen kan du køre?',opts:['5–6 nætter','3–4 nætter','1–2 nætter']},
 {id:'exp',q:'Hvor meget erfaring har du med at køre i bil eller varevogn?',opts:['Mere end 3 år','1–3 år','Under 1 år']},
 {id:'start',q:'Hvornår kan du starte?',opts:['Med det samme','Inden for 2–4 uger','Om mere end en måned']},
 {id:'snow',q:'Det sner, og du er 30 minutter forsinket på ruten. Hvad gør du?',opts:['Kører sikkert, giver driftslederen besked og prioriterer de vigtigste shops','Kører hurtigere for at nå det','Springer et par shops over']},
 {id:'closed',q:'Pakkeshoppen er lukket, og der er ingen nøgleboks. Hvad gør du?',opts:['Ringer til driftslederen og følger proceduren – pakkerne tages med retur','Stiller pakkerne foran døren','Kører videre og prøver i morgen']},
 {id:'scan',q:'Hvorfor er det vigtigt at scanne hver pakke ved overdragelse?',opts:['Så kunden og dao kan se, hvor pakken er – og jeg er dækket ind','Det er ikke så vigtigt, hvis pakken er leveret','Kun ved dyre pakker']},
 {id:'pay',q:'Sidste spørgsmål: lønnen er akkord efter 3F – jo hurtigere og mere præcist, jo mere tjener du. Hvad tænker du om det?',opts:['Det passer mig fint','Jeg foretrækker fast timeløn','Ved ikke endnu']},
];
const SLOTS=[['tor 20/11','10:00'],['tor 20/11','13:30'],['fre 21/11','09:00'],['man 24/11','11:00'],['tir 25/11','14:00']];
const MEET={teams:['💻','Teams-møde','15 min. Link sendes på SMS og mail'],phone:['📞','Telefonmøde','HR ringer dig op'],person:['🤝','Personligt møde','På terminalen']};
const KPIS=[['ontime','Punktlighed',92,'%','⏰'],['scan','Scanning ved overdragelse',95,'%','📦'],['proc','Procedure i pakkeshop',95,'%','🏪'],['absence','Fravær (dage)',1,'#','📅'],['incidents','Hændelser',1,'#','⚠️']];

const S={view:'cand',lang:'da',src:'landing',step:'landing',form:{name:'Mikkel Jensen',phone:'+45 22 33 44 55',area:'KBH',veh:'car',lang:'da'},
 chat:[],qi:0,typing:false,me:null,meet:'teams',slot:null,sel:null,filter:'all',kpiTab:'api',toast:null,log:[],emply:[]};

// ---------- AI (eksempel – i drift Azure OpenAI i dao's Azure, pseudonymiseret input) ----------
function aiAssess(ans){
 const w={mot:[85,55,80],night:[95,70,35],exp:[90,75,50],start:[90,75,55],snow:[95,35,10],closed:[95,15,30],scan:[95,30,40],pay:[90,45,60]};
 const sc=Object.entries(ans).map(([k,v])=>w[k][v]);
 const score=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
 const flags=[];
 if(ans.night===2)flags.push('Kun 1–2 nætter om ugen – dao har brug for 5–6');
 if(ans.snow===2||ans.closed===1)flags.push('Svar i situationsspørgsmål bryder procedure');
 if(ans.scan===1)flags.push('Undervurderer scanning');
 if(ans.pay===1)flags.push('Foretrækker fast timeløn (akkord er standard)');
 const riskPts=(ans.mot===1?2:0)+(ans.night>=1?ans.night:0)+(ans.start===2?1:0)+(ans.pay===1?2:ans.pay===2?1:0);
 const risk=riskPts<=1?['Lav','bg-emerald-50 text-emerald-700']:riskPts<=3?['Mellem','bg-amber-50 text-amber-800']:['Høj','bg-orange-100 text-orange-800'];
 const rec=score>=80&&flags.length===0?['Anbefal interview','bg-emerald-50 text-emerald-800']:score>=65?['Vurdér manuelt','bg-amber-50 text-amber-800']:['Ikke anbefalet','bg-orange-50 text-orange-800'];
 const parts=[];
 parts.push(ans.mot===1?'Motivationen er primært at få et job.':'Kandidaten virker motiveret for selvstændigt natarbejde.');
 parts.push(['Kan køre 5–6 nætter om ugen.','Kan køre 3–4 nætter om ugen.','Kan kun køre 1–2 nætter om ugen.'][ans.night]);
 parts.push(ans.snow===0&&ans.closed===0&&ans.scan===0?'Svarer sikkert og efter procedure i alle situationer.':'Enkelte svar afviger fra dao’s procedurer.');
 if(flags.length)parts.push('Spørg ved interview ind til: '+flags.map(f=>f.toLowerCase()).join('; ')+'.');
 return {score,risk,rec,flags,summary:parts.join(' ')};
}

// ================= HANDLINGER =================
function setKpi(c,rows,src){
 if(!rows.length){toast('Ingen rækker fundet');return}
 const avg=k=>rows.reduce((x,r)=>x+r[k],0)/rows.length;
 c.kpi={ontime:Math.round(avg('ontime')),scan:Math.round(avg('scan')),proc:Math.round(avg('proc')),absence:rows.reduce((x,r)=>x+r.absence,0),incidents:rows.reduce((x,r)=>x+r.incidents,0)};
 c.kpiSrc=src;c.kpiAt=now();log(c,`KPI opdateret (${src}, ${rows.length} rækker)`);toast(`✓ ${rows.length} ${rows.length===1?'registrering':'dage'} indlæst`);
}
const parseCsv=t=>t.split(/\r?\n/).slice(1).map(l=>l.split(/[;\t]/)).filter(x=>x.length>=6).map(x=>({ontime:+x[1].replace(',','.'),scan:+x[2].replace(',','.'),proc:+x[3].replace(',','.'),absence:+x[4],incidents:+x[5]})).filter(r=>!isNaN(r.ontime));
function aiTurn(){
 S.typing=true;render();
 setTimeout(()=>{S.typing=false;if(S.qi<QUESTIONS.length)S.chat.push({t:QUESTIONS[S.qi].q});render()},700);
}
function answer(i,text){
 const q=QUESTIONS[S.qi]; S.me.ans=S.me.ans||{}; S.me.ans[q.id]=i; S.chat.push({me:true,t:text??q.opts[i]}); S.qi++;
 if(S.qi>=QUESTIONS.length){S.me.ai=aiAssess(S.me.ans);S.me.stage='ai';S.typing=true;render();setTimeout(()=>{S.typing=false;S.chat.push({t:'Tak for dine svar! Jeg har sendt en opsummering til dao’s HR. Du hører fra dem inden for 2 hverdage.'});log(S.me,'AI-interview gennemført · score '+S.me.ai.score,['POST /applications/{id}/form-data',`AI-interview: score ${S.me.ai.score} · frafaldsrisiko ${S.me.ai.risk[0].toLowerCase()} · ${S.me.ai.rec[0].toLowerCase()}`]);render()},900);return}
 aiTurn();
}
function newApplicant(){
 const c={id:'K'+(3200+S.cands.length),name:S.form.name,area:S.form.area,veh:S.form.veh,src:S.src,lang:S.form.lang,applied:new Date().toLocaleDateString('da-DK'),stage:'new',ans:null,ai:null,meet:null,interview:null,week:0,kpi:{ontime:95,scan:97,proc:96,absence:0,incidents:0},kpiSrc:'api',kpiAt:'06:00',confirmed:null,isNew:true};
 S.cands.unshift(c);S.me=c;log(c,'Ansøgning modtaget',S.src==='landing'?['POST /applications/create','Straksansøgning oprettet i Emply']:null);return c;
}
document.addEventListener('input',e=>{const f=e.target.dataset?.f;if(f)S.form[f]=e.target.value});
document.addEventListener('change',e=>{
 if(e.target.dataset?.f){S.form[e.target.dataset.f]=e.target.value;return}
 const id=e.target.dataset?.csv; if(!id||!e.target.files[0])return;
 const r=new FileReader();r.onload=()=>{setKpi(find(id),parseCsv(String(r.result)),'csv');render()};r.readAsText(e.target.files[0]);
});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const a=el.dataset.act, c=el.dataset.id&&find(el.dataset.id);
 switch(a){
  case 'view':S.view=el.dataset.v;break;
  case 'f':S.form[el.dataset.k]=el.dataset.v;break;
  case 'apply':if(!S.form.name.trim()||!S.form.phone.trim()){toast('Udfyld navn og mobil');return}newApplicant();S.step='sms';break;
  case 'openInterview':S.step='interview';S.chat=[];S.qi=0;aiTurn();return;
  case 'ilang':S.lang=S.lang==='da'?'en':'da';toast(S.lang==='en'?'Interview continues in English (demo)':'Interviewet fortsætter på dansk');return;
  case 'answer':answer(+el.dataset.i);return;
  case 'answerFree':{const v=document.getElementById('free').value.trim();if(!v)return;answer(0,v);return}
  case 'toBook':S.step='book';break;
  case 'meet':S.meet=el.dataset.k;break;
  case 'slot':S.slot=+el.dataset.i;break;
  case 'book':if(S.slot==null){toast('Vælg en tid');return}S.me.stage='hr';S.me.meet={type:S.meet,slot:SLOTS[S.slot]};log(S.me,'Interview booket · '+MEET[S.meet][1],['Microsoft Graph · POST /events',`${MEET[S.meet][1]} ${SLOTS[S.slot].join(' ')} i HR’s kalender`]);S.step='booked';break;
  case 'page':S.page=el.dataset.p;S.sel=null;break;
  case 'filter':S.filter=el.dataset.s;break;
  case 'open':S.sel=el.dataset.id;break;
  case 'close':S.sel=null;break;
  case 'invite':c.stage='hr';log(c,'Inviteret til interview',['POST /applications/{id}/form-data','Inviteret til interview (HR)']);toast('✓ Invitation sendt – kandidaten booker selv tid');break;
  case 'reject':c.stage='rejected';log(c,'Afvist af HR',['POST /applications/{id}/form-data','Afvist (HR-beslutning)']);S.sel=null;toast('Afvist og logget');break;
  case 'interviewOk':c.interview={ok:true,by:'Mette K. (HR)',at:new Date().toLocaleDateString('da-DK'),note:document.getElementById('note')?.value||''};c.stage='trial';c.week=1;log(c,'Interview godkendt → prøveperiode',['POST /applications/{id}/form-data · Samtale','Interview godkendt → prøveperiode startet']);toast('✓ Prøveperiode startet');break;
  case 'kpiTab':S.kpiTab=el.dataset.t;break;
  case 'kpiSync':c.kpiSrc='api';c.kpiAt=now();log(c,'KPI synket fra dao’s driftssystem');toast('✓ Synket fra dao’s driftssystem');break;
  case 'csvDemo':setKpi(c,parseCsv('dato;punktlighed;scanning;procedure;fravaer;haendelser\n2026-11-10;93;96;97;0;0\n2026-11-11;88;94;92;0;1\n2026-11-12;95;97;96;0;0\n2026-11-13;90;95;94;1;0'),'csv');break;
  case 'kpiManual':{const r={};for(const [k] of KPIS){const v=+String(document.querySelector(`[data-kpi="${k}"]`).value).replace(',','.');if(isNaN(v)){toast('Udfyld alle felter');return}r[k]=v}setKpi(c,[r],'manual');break}
  case 'confirm':c.stage='full';c.confirmed={by:'Mette K. (HR)',at:new Date().toLocaleDateString('da-DK')};log(c,'Fuld ansættelse bekræftet',['POST /applications/{id}/form-data · Ansat','Fuld ansættelse bekræftet (HR)']);toast('🎉 Fuld ansættelse bekræftet');break;
  case 'tourNext':tourGo(TOUR.i+1);return;
  case 'tourPrev':tourGo(TOUR.i-1);return;
  case 'tourMin':TOUR.min=!TOUR.min;break;
  case 'tourReset':location.reload();return;
 }
 render();
});

function ensureMe(stage){
 if(!S.me){newApplicant()}
 const c=S.me;
 if(stage>=1&&!c.ai){c.ans={mot:0,night:0,exp:1,start:0,snow:0,closed:0,scan:0,pay:0};c.ai=aiAssess(c.ans);c.stage='ai'}
 if(stage>=2&&!c.meet){c.meet={type:'teams',slot:SLOTS[0]};c.stage='hr'}
 if(stage>=3&&!c.interview){c.interview={ok:true,by:'Mette K. (HR)',at:new Date().toLocaleDateString('da-DK')};c.stage='trial';c.week=5;c.kpi={ontime:89,scan:96,proc:93,absence:0,incidents:1}}
 return c;
}

 {t:'HR: hele flowet på én skærm',d:'Fem trin med tydeligt ansvar – AI eller HR. AI-score og frafaldsrisiko står direkte i listen. Det sparer den manuelle screening.',run(){ensureMe(2);S.view='hr';S.page='flow';S.filter='all';S.sel=null}},
 {t:'AI-opsummering → Emply',d:'HR ser score, frafaldsrisiko, en kort opsummering, flag og hele interviewet. Resultatet er sendt til Emply. HR inviterer eller afviser – AI afviser aldrig selv.',run(){S.view='hr';S.page='flow';S.filter='1';const c=S.cands.find(x=>x.stage==='ai'&&x.ai.flags.length)||S.cands.find(x=>x.stage==='ai');S.sel=c.id}},
 {t:'③ Interview · HR',d:'Bookingerne ligger i HR’s kalender. Efter samtalen godkender HR med én knap – det synkes til Emply som “Samtale”, og prøveperioden starter.',run(){const c=ensureMe(2);S.view='hr';S.page='calendar';S.sel=c.id}},
 {t:'④ Prøveperiode · AI-assisted',d:'AI følger arbejdsgange og disciplin: punktlighed, scanning, procedure i pakkeshop, fravær og hændelser – og markerer afvigelser før check-ins i uge 1, 4, 8 og 12. Data kommer via integration, CSV-upload eller manuel indtastning.',run(){const c=ensureMe(3);S.view='hr';S.page='flow';S.filter='3';S.sel=c.id;S.kpiTab='csv'}},

 {t:'Kandidaten følger med',d:'Kandidaten ser hele tiden, hvor hun er, og hvad næste skridt er – på mobil-web med SMS. Ingen app.',run(){ensureMe(3);S.view='cand';S.step='status'}},
 {t:'Emply',d:'Ansøgninger hentes hvert 15. minut. AI-resultat, interview, prøveperiode og ansættelse skrives tilbage på ansøgningen.',run(){S.view='hr';S.page='emply';S.sel=null}},
